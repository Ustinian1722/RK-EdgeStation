name: Release history audit

on:
  push:
    branches: [main, "release/**"]
    paths:
      - "scripts/audit_release_history.py"
      - ".github/workflows/release-history-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch all branch heads and tags
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags
      - name: Screen reachable history (redacted)
        run: python3 scripts/audit_release_history.py
